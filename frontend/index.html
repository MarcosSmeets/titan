<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Titan - Aerospace Simulation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
        --bg-0: #06060c;
        --bg-1: #0a0a14;
        --bg-2: #0e0e1a;
        --bg-3: #141422;
        --border: #1a1a2e;
        --border-subtle: #12121e;
        --text-0: #eef0f6;
        --text-1: #b0b4c4;
        --text-2: #6b7088;
        --text-3: #3d4058;
        --accent: #3b82f6;
        --accent-dim: #2563eb;
        --green: #22c55e;
        --green-dim: rgba(34,197,94,0.12);
        --red: #ef4444;
        --red-dim: rgba(239,68,68,0.12);
        --amber: #f59e0b;
        --amber-dim: rgba(245,158,11,0.12);
        --purple: #a855f7;
        --cyan: #06b6d4;
      }
      html, body, #root { height: 100%; overflow: hidden; }
      body {
        font-family: var(--font-sans);
        background: var(--bg-0);
        color: var(--text-0);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      input, button, select, textarea { font-family: inherit; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      @keyframes glow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
